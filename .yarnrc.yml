yarnPath: .yarn/releases/yarn-4.18.0.cjs
nodeLinker: node-modules

# Yarn 4.18부터 install script가 기본 비활성(supply-chain 하드닝).
# sharp/esbuild/protobufjs/unrs-resolver의 native 바인딩 rebuild가 필요하므로
# 기존(4.12) 동작을 유지한다. 개별 allowlist(dependenciesMeta.built)로 좁히려면
# 클린 install로 네이티브 모듈 동작을 실증한 뒤 변경할 것.
enableScripts: true

npmScopes:
    y0ngha:
        npmRegistryServer: 'https://npm.pkg.github.com'
        npmAuthToken: ${SIGLENS_GITHUB_TOKEN}
