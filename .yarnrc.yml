yarnPath: .yarn/releases/yarn-4.18.0.cjs
nodeLinker: node-modules

# Yarn 4.18부터 install script가 기본 비활성(supply-chain 하드닝).
# sharp/esbuild/protobufjs/unrs-resolver의 native 바인딩 rebuild가 필요하므로
# 기존(4.12) 동작을 유지한다. 개별 allowlist(dependenciesMeta.built)로 좁히려면
# 클린 install로 네이티브 모듈 동작을 실증한 뒤 변경할 것.
enableScripts: true

# Yarn 4.18의 `npmMinimalAgeGate`(기본 1일)는 갓 배포된 버전을 quarantine 한다.
# 서드파티 공급망 방어용이라 그대로 두되, **우리가 직접 발행하는** siglens-core만
# 예외로 뺀다. 없으면 core를 릴리스한 날에는 siglens가 그 버전을 설치할 수 없다.
# (증상 메시지가 `All versions satisfying "x.y.z" are quarantined`라 인증 문제로 오독하기 쉽다.)
npmPreapprovedPackages:
    - '@y0ngha/siglens-core'

npmScopes:
    y0ngha:
        npmRegistryServer: 'https://npm.pkg.github.com'
        # `:-` 기본값으로 토큰 없이도 yarn 명령이 뜨게 한다 — install 스텝에만 시크릿을
        # 주고(최소 권한), typecheck/lint/test 스텝은 토큰 없이 실행하기 위해서다.
        npmAuthToken: ${SIGLENS_GITHUB_TOKEN:-}
