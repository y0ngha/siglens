<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>오프라인 | Siglens</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 1.5rem;
      gap: 1rem;
    }
    img { border-radius: 16px; }
    h1 { font-size: 1.125rem; font-weight: 700; }
    p { font-size: 0.875rem; color: #94a3b8; line-height: 1.5; }
  </style>
</head>
<body>
  <img src="/icon192.png" width="72" height="72" alt="SigLens" />
  <h1>오프라인 상태입니다</h1>
  <p>인터넷 연결을 확인하고 다시 시도해 주세요.</p>
  <script>
    // 같은 파일을 siglens.io와 ai.siglens.io의 서비스 워커가 각자 프리캐시한다.
    // 설치한 SIGLENS AI 앱이 메인 사이트 이름으로 뜨지 않게 ai 호스트에서만 제목을 바꾼다.
    // 호스트 목록은 `src/shared/config/aiHost.ts`의 AI_HOSTS와 같아야 한다(정적 파일이라
    // import할 수 없다 — `src/app/__tests__/offlinePageAiHosts.test.ts`가 둘을 맞춘다).
    // 이 페이지는 이동 요청에 대한 응답이라 주소는 원래 가려던 URL이고, 그 로케일
    // 접두사로 제품명 표기를 고른다(ko는 접두사 없음 → 시그렌즈 AI, 그 외 SIGLENS AI).
    var AI_HOSTS = ['ai.siglens.io', 'ai.localhost'];
    if (AI_HOSTS.indexOf(location.hostname) !== -1) {
      var seg = location.pathname.split('/')[1];
      var name = ['en', 'ja', 'zh'].indexOf(seg) !== -1 ? 'SIGLENS AI' : '시그렌즈 AI';
      document.title = '오프라인 | ' + name;
      document.querySelector('img').alt = name;
    }
  </script>
</body>
</html>
