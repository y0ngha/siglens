name: CI

on:
    pull_request:
        types: [opened, synchronize, reopened]

concurrency:
    group: ci-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # Cheap detect job: decide whether the heavy `ci` job runs. Needs a checkout
    # only to read .github/path-filters.yml; the PR diff comes from the REST API.
    changes:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            run: ${{ steps.gate.outputs.run }}
        steps:
            - uses: actions/checkout@v4
            - uses: dorny/paths-filter@v4
              id: f
              with:
                  filters: .github/path-filters.yml
            # Run CI unless every changed file is CI-irrelevant. skills are .md
            # (inside ci_irrelevant) so rescue CI when any skills file changed.
            - name: Compute gate
              id: gate
              run: |
                  if [ "${{ steps.f.outputs.all_count }}" != "${{ steps.f.outputs.ci_irrelevant_count }}" ] || [ "${{ steps.f.outputs.skills }}" = "true" ]; then
                      echo "run=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "run=false" >> "$GITHUB_OUTPUT"
                  fi

    ci:
        needs: changes
        if: needs.changes.outputs.run == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            - name: Enable Corepack
              run: corepack enable

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: yarn

            # 레지스트리 토큰은 install 스텝에만 노출한다(최소 권한). .yarnrc.yml이
            # `${SIGLENS_GITHUB_TOKEN:-}`로 기본값을 두므로 이후 스텝은 토큰 없이 돈다.
            # --mode=skip-build: 이 잡은 typecheck/lint/format/test만 돌려 네이티브
            # 빌드가 필요 없고, 시크릿이 있는 동안 패키지 lifecycle 코드를 실행하지 않는다.
            - name: Install dependencies
              env:
                  SIGLENS_GITHUB_TOKEN: ${{ secrets.SIGLENS_GITHUB_TOKEN }}
              run: yarn install --immutable --mode=skip-build

            - name: Type check
              run: yarn typecheck

            - name: Validate skills
              run: yarn validate:skills

            - name: Verify skill digests
              run: yarn skills:digest-verify

            - name: Lint
              run: yarn lint

            - name: Format check
              run: yarn format:check

            - name: i18n lint (미추출 한국어 기준선)
              run: yarn i18n:lint

            - name: i18n verify (번역 카탈로그 게이트)
              run: yarn i18n:verify

            # 생성 산출물(`clientKeys.json`·`ko.json`·`skips.json`)이 소스와
            # 어긋나면 잡는다. stale 산출물은 **조용히** 틀린다 — 커버리지
            # 테스트는 리터럴 키만 보므로 동적 조회 네임스페이스가 빠져도
            # 통과하고, 화면에서만 원문이 노출된다(라운드 9 실측).
            - name: i18n extract drift (생성 산출물이 소스와 일치)
              run: |
                  yarn i18n:extract --write
                  git diff --exit-code -- messages/

            - name: Test
              run: yarn test

    # Required-check gate: always runs so a path-skipped `ci` never leaves a
    # required check stuck "pending". Mark THIS job required (not `ci`).
    ci-required:
        needs: [changes, ci]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Verify CI did not fail
              run: |
                  if [ "${{ needs.changes.result }}" = "failure" ] || [ "${{ needs.changes.result }}" = "cancelled" ]; then
                      echo "detect job failed"; exit 1
                  fi
                  if [ "${{ needs.ci.result }}" = "failure" ] || [ "${{ needs.ci.result }}" = "cancelled" ]; then
                      echo "ci failed"; exit 1
                  fi
                  echo "ci ok (result=${{ needs.ci.result }})"
