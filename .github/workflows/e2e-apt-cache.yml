name: E2E apt cache

# e2e 잡의 Playwright 시스템 의존 설치는 webkit·chromium용 apt 패키지(약 181개, 125MB)를 매 샤드마다
# azure.archive.ubuntu.com에서 받는다. 그 미러가 연결은 유지한 채 아주 느리게 보내며 멈추는 일이 잦아
# (2026-10-23 하루에 샤드 5번이 5분 제한에 걸림, 이미지의 apt 무응답 제한 15초도 걸리지 않음) 다운로드
# 자체를 없앤다. 이 워크플로가 기본 브랜치에서 .deb를 받아 캐시에 저장하고, e2e 잡이 복원한다.
# 기본 브랜치에서 만든 캐시는 모든 PR이 읽을 수 있다 — PR 실행이 만든 캐시는 그 PR에서만 읽힌다.
#
# 키(`.github/actions/e2e-apt-cache-key`): 러너 이미지 버전 + Playwright 버전. 새 키는 월요일 주간 실행이나,
# 아래 경로(의존성·이 워크플로)를 바꾼 master push에서 만든다. 이미지가 그 사이에 바뀌면 다음 실행까지 e2e는
# 이전 이미지 키를 restore-keys로 받는다(달라진 패키지만 미러에서 받는다). 급하면 수동 실행한다.
on:
    push:
        branches: [master]
        paths:
            - package.json
            - yarn.lock
            - .github/workflows/e2e.yml
            - .github/workflows/e2e-apt-cache.yml
            - .github/actions/e2e-apt-cache-key/**
    schedule:
        - cron: '17 3 * * 1'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: e2e-apt-cache
    cancel-in-progress: false

jobs:
    seed:
        runs-on: ubuntu-latest
        # 미러가 멈춰도 기본 360분을 태우지 않게 한다(정상 다운로드는 1~2분). 설치 최악
        # (420+15)+20+(60+10)+(420+15) = 960초에 체크아웃·yarn install을 더해도 들어가는 값이다.
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Cache key
              id: key
              uses: ./.github/actions/e2e-apt-cache-key

            - name: Check existing cache
              id: hit
              uses: actions/cache/restore@v4
              with:
                  path: ~/apt-debs
                  key: ${{ steps.key.outputs.key }}
                  lookup-only: true

            # e2e.yml과 같은 설치 경로(Corepack → yarn install)로 같은 Playwright CLI를 쓴다.
            - name: Enable Corepack
              if: steps.hit.outputs.cache-hit != 'true'
              run: corepack enable

            - name: Setup Node
              if: steps.hit.outputs.cache-hit != 'true'
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: yarn

            - name: Install dependencies
              if: steps.hit.outputs.cache-hit != 'true'
              env:
                  SIGLENS_GITHUB_TOKEN: ${{ secrets.SIGLENS_GITHUB_TOKEN }}
              run: yarn install --immutable

            # 빈 아카이브에서 설치해 이번에 받은 .deb만 모은다. root로 돈 `timeout`이 프로세스 그룹 전체
            # (playwright → apt-get → dpkg)를 끊는다. 한 번 더 시도한다.
            - name: Download Playwright system dependencies
              if: steps.hit.outputs.cache-hit != 'true'
              run: |
                  # `yarn playwright`가 실행하는 @playwright/test의 bin(cli.js) — 호이스팅과 무관하게 키의 버전과 같다.
                  cli="$(node -p "require('path').join(require('path').dirname(require.resolve('@playwright/test/package.json')), 'cli.js')")"
                  sudo apt-get clean
                  for attempt in 1 2; do
                      sudo timeout -k 15 420 "$(command -v node)" "$cli" install-deps chromium webkit && break
                      [ "$attempt" = 2 ] && exit 1
                      sleep 20
                      sudo timeout -k 10 60 dpkg --configure -a || true
                  done
                  mkdir -p ~/apt-debs
                  find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp {} ~/apt-debs/ \;
                  n="$(find ~/apt-debs -name '*.deb' | wc -l)"
                  echo "cached .deb files: ${n}, $(du -sh ~/apt-debs | cut -f1)"
                  # 비거나 거의 빈 캐시가 정확한 키를 차지하면 다음 실행이 lookup-only로 건너뛰어 고쳐지지 않는다.
                  # 정상은 약 180개(2026-10-23 webkit+chromium); 50개 미만이면 저장하지 않고 실패한다.
                  if [ "$n" -lt 50 ]; then
                      echo "::error::only ${n} .deb files collected; refusing to save the cache"
                      exit 1
                  fi

            - name: Save cache
              if: steps.hit.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                  path: ~/apt-debs
                  key: ${{ steps.hit.outputs.cache-primary-key }}
