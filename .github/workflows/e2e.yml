name: E2E

on:
    pull_request:

# Least privilege: checkout + upload artifacts. @y0ngha/siglens-core installs
# from npm.pkg.github.com (see .yarnrc.yml) using the SIGLENS_GITHUB_TOKEN
# secret below, NOT the built-in GITHUB_TOKEN — the built-in token cannot read
# this user-scoped GitHub Packages package, so `packages: read` is unused here.
permissions:
    contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
    group: e2e-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    # Cheap detect job: decide whether the heavy `e2e` job runs. Needs a checkout
    # only to read .github/path-filters.yml; the PR diff comes from the REST API.
    changes:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            run: ${{ steps.gate.outputs.run }}
        steps:
            - uses: actions/checkout@v4
            - uses: dorny/paths-filter@v4
              id: f
              with:
                  filters: .github/path-filters.yml
            # Run E2E unless every changed file is E2E-irrelevant.
            - name: Compute gate
              id: gate
              run: |
                  if [ "${{ steps.f.outputs.all_count }}" != "${{ steps.f.outputs.e2e_irrelevant_count }}" ]; then
                      echo "run=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "run=false" >> "$GITHUB_OUTPUT"
                  fi

    e2e:
        needs: changes
        if: needs.changes.outputs.run == 'true'
        runs-on: ubuntu-latest
        # 러너 4대로 샤딩한다. playwright.config.ts가 CI에서 `workers: 1`로 직렬
        # 실행하므로(단일 Next 서버에 워커를 여러 개 붙이면 DB 쓰기 액션이 flaky)
        # 한 잡에서는 247개 테스트가 5분 넘게 걸린다(2026-10-04 실측 5분 18초).
        # 샤드는 잡마다 Postgres·Redis·Next 서버를 **따로** 띄우므로 서버 경합 없이
        # 병렬화된다 — "워커별 독립 서버"를 러너 단위로 얻는 셈이다.
        # 샤드 수를 바꿀 때는 matrix.shard 배열만 고친다 — 분모는 strategy.job-total이다.
        #
        # fail-fast: false — 한 샤드가 깨져도 나머지를 끝까지 돌려 실패 목록을 한 번에 본다.
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            # Yarn 4 ships via Corepack; enable it before setup-node so the
            # yarn cache resolves against the project's pinned packageManager.
            - name: Enable Corepack
              run: corepack enable

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: yarn

            # .yarnrc.yml authenticates the @y0ngha scope to GitHub Packages via
            # ${SIGLENS_GITHUB_TOKEN}. 내장 GITHUB_TOKEN은 이 user-scoped 패키지를
            # 읽을 수 없어(403) 저장소에 SIGLENS_GITHUB_TOKEN(read:packages PAT)이
            # 반드시 있어야 한다. 토큰은 install 스텝에만 노출한다(최소 권한) —
            # .yarnrc.yml의 `${SIGLENS_GITHUB_TOKEN:-}` 기본값 덕에 나머지 스텝은
            # 토큰 없이도 yarn을 쓸 수 있다.
            - name: Install dependencies
              env:
                  SIGLENS_GITHUB_TOKEN: ${{ secrets.SIGLENS_GITHUB_TOKEN }}
              run: yarn install --immutable

            # 브라우저 설치를 **백그라운드로** 시작한다. 이 스텝의 약 60초 중 50초는
            # webkit용 apt 패키지 181개(125MB) 설치라 브라우저 바이너리를 캐시해도
            # 줄지 않는다(다운로드는 9초). 대신 CPU를 거의 안 쓰는 대기 시간이므로
            # 아래 백엔드 기동·마이그레이션·`next build`(합쳐 70초 남짓)와 겹쳐서
            # 잡당 1분가량을 없앤다. 결과는 "Wait for Playwright browsers" 스텝이 회수한다.
            #
            # 종료 코드를 파일로 남기는 이유: 백그라운드 프로세스의 실패는 이 스텝의
            # 종료 코드에 반영되지 않는다. 회수 스텝이 이 파일로 성공·실패를 판정한다.
            - name: Install Playwright browsers (background)
              run: |
                  nohup sh -c '
                      yarn playwright install --with-deps chromium webkit > "$RUNNER_TEMP/playwright-install.log" 2>&1
                      echo $? > "$RUNNER_TEMP/playwright-install.exit"
                  ' > /dev/null 2>&1 &

            # Start the Docker backend with Compose (NOT GitHub `services:`).
            # global-setup.ts runs migrate/seed via `docker compose exec`, which
            # requires a Compose project to exist — `services:` containers have
            # none, so they would break global-setup. This reuses the exact
            # local `e2e:up` path (DRY) and keeps global-setup unmodified.
            - name: Start backend (Docker Compose)
              run: yarn e2e:up

            # Explicit readiness gate before handing off to global-setup's own
            # pg_isready poll — fail fast with logs if a container never goes
            # healthy, rather than timing out deep inside the test run.
            - name: Wait for backend health
              run: |
                  echo "Waiting for Postgres and Redis to report healthy..."
                  for i in $(seq 1 60); do
                      pg_status="$(docker compose -f docker-compose.e2e.yml ps postgres --format '{{.Health}}')"
                      redis_status="$(docker compose -f docker-compose.e2e.yml ps redis --format '{{.Health}}')"
                      echo "attempt $i: postgres=$pg_status redis=$redis_status"
                      if [ "$pg_status" = "healthy" ] && [ "$redis_status" = "healthy" ]; then
                          echo "Backend is healthy."
                          exit 0
                      fi
                      sleep 2
                  done
                  echo "Backend did not become healthy in time. Dumping status + logs:"
                  docker compose -f docker-compose.e2e.yml ps
                  docker compose -f docker-compose.e2e.yml logs
                  exit 1

            # Migrate + seed the e2e DB BEFORE the cold prod build runs. The
            # build statically prerenders /privacy and /terms, which
            # query the `terms` table — so the schema AND active seed rows must
            # exist before `next build`, or the build worker dies with
            # `relation "terms" does not exist` (42P01). This runs the SAME
            # idempotent global-setup (bootstrap + migrate + seed) that
            # test:e2e's globalSetup runs again later; the second run is a no-op.
            - name: Migrate + seed e2e DB
              run: yarn e2e:db

            # 프로덕션 빌드를 Playwright webServer 밖에서 미리 한다. 위에서 백그라운드로
            # 시작한 브라우저 설치와 겹치게 하려는 것이다 — webServer 안에서 빌드하면
            # `playwright test`가 브라우저 설치를 기다린 **뒤에야** 빌드가 시작된다.
            # 명령은 playwright.config.ts의 webServer가 쓰던 것과 같은 형태(`dotenv -e
            # .env.e2e`, CI에는 의도적으로 .env.local이 없다)라 빌드 입력(E2E_TEST=1
            # 등)이 동일하다. CI=1도 같이 준다 — webServer는 테스트 스텝의 env를
            # 물려받아 빌드해 왔으므로 그 조건을 그대로 맞춘다.
            - name: Build (E2E prod build)
              run: node_modules/.bin/dotenv -e .env.e2e -- yarn build
              env:
                  CI: '1'

            - name: Wait for Playwright browsers
              run: |
                  for i in $(seq 1 150); do
                      if [ -f "$RUNNER_TEMP/playwright-install.exit" ]; then
                          code="$(cat "$RUNNER_TEMP/playwright-install.exit")"
                          cat "$RUNNER_TEMP/playwright-install.log"
                          echo "playwright install exited with $code"
                          exit "$code"
                      fi
                      sleep 2
                  done
                  echo "Playwright install did not finish within 5 minutes. Log so far:"
                  cat "$RUNNER_TEMP/playwright-install.log" || true
                  exit 1

            # CI=1 → reuseExistingServer is false and retries: 2. globalSetup runs
            # migrate+seed via compose exec (no-op: already done above), then the
            # webServer starts the app built above — E2E_PREBUILT=1 tells
            # playwright.config.ts to skip its own `yarn build` — and runs this
            # shard's slice of the projects.
            - name: Run E2E tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
              run: yarn test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
              env:
                  CI: '1'
                  E2E_PREBUILT: '1'

            # 아티팩트 이름은 런 안에서 유일해야 한다 — 샤드 번호를 붙인다.
            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report-shard-${{ matrix.shard }}
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7

            # Clean up Docker volumes/containers regardless of outcome.
            - name: Tear down backend
              if: always()
              run: yarn e2e:down

    # Required-check gate: always runs so a path-skipped `e2e` never leaves a
    # required check stuck "pending". Mark THIS job required (not `e2e`).
    # 매트릭스 잡의 `needs.e2e.result`는 샤드 전체의 합산 결과다(하나라도 실패면 failure).
    e2e-required:
        needs: [changes, e2e]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Verify E2E did not fail
              run: |
                  if [ "${{ needs.changes.result }}" = "failure" ] || [ "${{ needs.changes.result }}" = "cancelled" ]; then
                      echo "detect job failed"; exit 1
                  fi
                  if [ "${{ needs.e2e.result }}" = "failure" ] || [ "${{ needs.e2e.result }}" = "cancelled" ]; then
                      echo "e2e failed"; exit 1
                  fi
                  echo "e2e ok (result=${{ needs.e2e.result }})"
