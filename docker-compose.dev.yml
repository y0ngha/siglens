# 로컬 개발용 Postgres. 운영 DB(RDS)와 분리된 일회용 인스턴스다.
#
# 사용: `yarn db:dev:up` → `yarn db:dev:migrate` (또는 `yarn db:dev:reset`).
# E2E는 자체 compose(docker-compose.e2e.yml, 포트 5433)를 쓰므로 건드리지 않는다.
#
# 포트·프로젝트 이름은 scripts/db-dev.sh가 DEV_DB_PORT / DEV_DB_PROJECT로 바꿀 수
# 있다 — 검증용 인스턴스를 사용자의 개발 DB(5435)와 겹치지 않게 띄울 때 쓴다.
name: siglens-dev

services:
    postgres:
        image: postgres:17
        environment:
            POSTGRES_USER: siglens
            POSTGRES_PASSWORD: siglens
            POSTGRES_DB: siglens_dev
        # 루프백에만 바인딩한다 — 같은 네트워크의 다른 기기에 개발 DB(siglens/siglens)를 열지 않는다.
        # Docker Desktop의 host.docker.internal(시드 스크립트)은 루프백 바인딩 포트에도 닿는다.
        ports: ['127.0.0.1:${DEV_DB_PORT:-5435}:5432']
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U siglens -d siglens_dev']
            interval: 2s
            timeout: 3s
            retries: 30

volumes:
    pgdata:
